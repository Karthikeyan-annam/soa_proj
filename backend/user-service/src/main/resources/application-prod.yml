server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/users}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  config:
    activate:
      on-profile: prod
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
cinepass:
  jwt:
    secret: ${CINEPASS_JWT_SECRET:cinepass-demo-secret-key-must-be-at-least-32-chars}
    expiration-ms: ${CINEPASS_JWT_EXPIRATION_MS:86400000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
