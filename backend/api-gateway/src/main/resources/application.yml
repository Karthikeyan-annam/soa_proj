server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173,http://localhost:5174"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/movies/**
        - id: show-service
          uri: lb://show-service
          predicates:
            - Path=/api/shows/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
cinepass:
  jwt:
    secret: cinepass-demo-secret-key-must-be-at-least-32-chars
