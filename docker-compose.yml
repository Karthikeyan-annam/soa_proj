services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cinepass
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cinepass"]
      interval: 5s
      timeout: 5s
      retries: 12

  eureka-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: user-service
    environment: &service-environment
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      CINEPASS_JWT_SECRET: ${CINEPASS_JWT_SECRET:?Set CINEPASS_JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  movie-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: movie-service
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movies
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  show-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: show-service
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shows
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: booking-service
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookings
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        SERVICE_MODULE: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CINEPASS_JWT_SECRET: ${CINEPASS_JWT_SECRET:?Set CINEPASS_JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      movie-service:
        condition: service_healthy
      show-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres-data:
