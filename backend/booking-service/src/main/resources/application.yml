server:
  port: 8084
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        connection:
          isolation: 2
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
