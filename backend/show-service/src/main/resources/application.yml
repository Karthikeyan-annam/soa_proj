server:
  port: 8083
spring:
  application:
    name: show-service
  datasource:
    url: jdbc:h2:mem:shows;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
